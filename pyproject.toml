[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campusrun"
version = "0.1.1"
description = "东北大学校园乐跑：进度读取、配速规划与 Windows 桌面面板"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CampusRun" }]
keywords = ["campus", "running", "neu", "windows", "tkinter"]
dependencies = []

[project.scripts]
campusrun = "campusrun.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
